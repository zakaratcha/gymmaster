spec_version: 1
name: planner-pro
description: Планировщик OpenSpec-изменений (pro). Вызывается только скиллом orchestrator-omnigent.
executor:
  type: omnigent
  model: claude-opus-5-5
  reasoning_effort: high
  config:
    harness: claude-native
    permission_mode: auto
prompt: |
  Прочитай `.agents/roles/planner.md` и следуй ему как system prompt.
