schema: agentic

context: |
  Пиши все артефакты на русском языке. Код, идентификаторы, пути и имена API оставляй как есть.
  Служебные заголовки и ключевые слова формата OpenSpec не переводи: "## ADDED/MODIFIED/REMOVED/RENAMED Requirements",
  "### Requirement:", "#### Scenario:", "WHEN/THEN/AND", "SHALL/MUST" — иначе валидатор их не распознает.
  Пиши коротко и по делу: без вступлений, повторов и очевидного. Предпочитай списки длинному тексту.

  Перед планированием, реализацией и ревью прочитай AGENTS.md и .cursor/rules/*.mdc и следуй им.
  Скилл e2e-mcp не используй, пока пользователь явно не попросил.

  Тесты обязательны: каждое изменение наблюдаемого поведения или API покрывается приёмочными тестами на Gherkin (Cucumber).
  - UI — tests/e2e/**/*.feature, запуск npm run test:e2e. Шаги и harness — tests/_harness/. Шаги по .cursor/rules/gherkin.mdc
    (Допустим → Когда → То, без Когда после То), на русском.
  - API — tests/api/**/*.feature, запуск npm run test:api.
  - UI-тест проверяет наблюдаемое следствие действия пользователя: то, что он видит или получает.
    Данные, которые видны только через API, наблюдаемым следствием не считаются.
    Подготовка данных через API допустима. Не добавляй e2e-шаг, который проверяет через API то, что пользователь не видит.
  - Изменение с наблюдаемым следствием в UI и правкой сервера — нужны оба вида тестов.
  - Vitest допустим как дополнение на нетривиальную логику, которую Gherkin-тесты не проверяют. Перед тем как назначить
    Vitest, сверь каждый его пункт с существующими и добавляемыми Gherkin-сценариями: пункт, который они проверяют,
    остаётся за ними. Vitest не заменяет Gherkin, не покрывает клиенты API и не проверяет контракт с сервером.
  - typecheck не проверяет шаги Gherkin: выражения шагов разбираются только при запуске cucumber.
  - API- и e2e-тесты ходят в одну постоянную БД, сброса между прогонами нет.
    Сценарии не меняют first-admin@local и second-trainer@local.

rules:
  proposal:
    - Явно укажи, что не входит в объём изменения
    - "В «Не входит» — только то, что не нужно для цели или исключено
      пользователем. Если без правки слоя решение становится обходом его
      дефекта, слой не исключай сам — вынеси вопрос пользователю"
  design:
    - Альтернативы — по одной строке на вариант
    - "Решение обходит дефект или недостающий контракт другого слоя — среди
      альтернатив обязательно исправление первопричины, отказ от него — с
      причиной"
    - "Обязательный список «Обходы и допущения»: каждый обход и допущение
      одной строкой с причиной; нет — «—»"
    - "В «Стратегия проверки» перечисли, какие .feature создаются или меняются
      (tests/e2e и/или tests/api), какие новые шаги и harness-блоки нужны.
      UI-тесты — только при наблюдаемом пользователем следствии; иначе напиши
      «UI-тесты не нужны» и причину"
    - "В «Стратегия проверки» у каждого пункта Vitest — какое поведение он
      проверяет, которого не проверяют Gherkin-сценарии изменения"
    - "Новый `*.utils.ts` в блоке — в решениях с причиной: какие файлы блока
      его используют или какой объём он выносит"
  specs:
    - "Обычно 1–3 сценария на требование; больше — для сохранения существующих
      сценариев MODIFIED и покрытия значимых граничных случаев"
    - "Каждый сценарий формулируй проверяемо — так, чтобы он напрямую переносился
      в Gherkin-сценарий tests/e2e или tests/api"
    - "Сценарий UI-требования описывает действие пользователя и то, что он
      наблюдает. Следствия, видные только через API, формулируй в API-требовании"
    - "Требование описывает поведение. Неясный текст ответа сервера исправляется
      на сервере, а не обходится в UI-требовании"
  tasks:
    - "Сохраняй в каждой задаче способ проверки, как требует шаблон tasks"
    - "Каждый сценарий из specs покрыт хотя бы одним Gherkin-сценарием. В задаче
      укажи, какие требования она покрывает. Сценарий о поведении API всегда
      покрывает API-тест"
    - "Изменение API — отдельная задача на коллекцию Bruno в src/server/<домен>/bruno/"
    - "Итоговая проверка включает npm run lint, npm test, npm run test:api и
      npm run test:e2e целиком, а не только typecheck и не один файл .feature"
    - "Проверка в задаче ловит ошибки своего вида: typecheck не проверяет шаги
      Gherkin, Vitest на чистой функции не проверяет контракт с сервером"
    - "Сценарии не меняют first-admin@local и second-trainer@local"
